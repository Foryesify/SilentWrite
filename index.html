<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SilentWrite">
  <title>SilentWrite</title>
  <style>
    html, body { margin: 0; background: #f3f3f3; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #202020; }
    }
  </style>
  <script>
    (function () {
      var dark = matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.style.background = dark ? '#202020' : '#f3f3f3'
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
    })()
  </script>
  <script type="module" src="/src/main.js"></script>
</head>

<body>
  <div id="root"></div>
</body>

</html>
